name: Voice Live AIPC CI

on:
  push:
    branches: [master]
    paths:
      - "Agents/Voice-Live-API-AIPC/**"
      - ".github/workflows/voice-live-aipc-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "Agents/Voice-Live-API-AIPC/**"
      - ".github/workflows/voice-live-aipc-ci.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Agents/Voice-Live-API-AIPC
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            Agents/Voice-Live-API-AIPC/requirements.txt
            Agents/Voice-Live-API-AIPC/requirements-dev.txt
      - run: python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/pre_delivery_check.py
      - run: python -m pip check
      - run: python -m pip_audit --local --progress-spinner off --timeout 15

  package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Agents/Voice-Live-API-AIPC
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            Agents/Voice-Live-API-AIPC/requirements.txt
            Agents/Voice-Live-API-AIPC/requirements-dev.txt
      - run: python -m pip install --upgrade pip==26.2.1 setuptools==83.0.0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m PyInstaller --noconfirm --clean VoiceLiveAgent-dir.spec
      - shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath "dist\VoiceLiveAgent\VoiceLiveAgent.exe"
          if ($exe.Length -le 0) { throw "Packaged EXE is empty" }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--self-check" `
            -WorkingDirectory $exe.DirectoryName -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged self-check exit=$($process.ExitCode)" }
          $reportPath = Join-Path $exe.DirectoryName "self_check.txt"
          if (-not (Test-Path -LiteralPath $reportPath)) { throw "Packaged self-check report missing" }
          $report = [IO.File]::ReadAllText($reportPath, [Text.Encoding]::UTF8)
          if ($report -notmatch "SELF_CHECK=PASS") { throw "Packaged self-check did not pass" }
          $forbidden = Get-ChildItem -LiteralPath $exe.DirectoryName -Recurse -Force -File |
            Where-Object { $_.Name -in @(".env", ".msal_token_cache.json", "password", "password.txt") }
          if ($forbidden) { throw "Credential-adjacent file found in package" }
          "PACKAGE_BUILD=PASS bytes=$($exe.Length) SELF_CHECK=PASS"
