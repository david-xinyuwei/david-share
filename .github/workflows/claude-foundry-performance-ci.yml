name: Claude Foundry Performance CI

on:
  push:
    paths:
      - "Agents/Claude-Foundry-LiteLLM-Performance/**"
      - ".github/workflows/claude-foundry-performance-ci.yml"
  pull_request:
    paths:
      - "Agents/Claude-Foundry-LiteLLM-Performance/**"
      - ".github/workflows/claude-foundry-performance-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  offline-checks:
    name: Offline checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: Agents/Claude-Foundry-LiteLLM-Performance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          lfs: false
          sparse-checkout: Agents/Claude-Foundry-LiteLLM-Performance
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the client packages used by the stream-parser tests
        run: python -m pip install -r coding-matrix/requirements.txt
      - name: Recompute the coding-matrix facts
        run: python -B coding-matrix/analyze.py --run-dir evidence/coding-matrix-20261026/matrix --check
      - name: Recompute the prompt-cache facts
        run: python -B coding-matrix/cache_analyze.py --run-dir evidence/coding-matrix-20261026/cache --check
      - name: Verify the gateway records
        run: python -B scripts/analyze.py --check
      - name: Re-render the pages and figures
        run: python -B scripts/render_docs.py --check
      - name: Offline tests
        run: python -B -m unittest discover -s tests -v
