name: AI Foundry Custom Code Training CI

on:
  push:
    paths:
      - "Deep-Learning/AI-Foundry-Custom-Code-Training/**"
      - ".github/workflows/ai-foundry-custom-code-training-ci.yml"
  pull_request:
    paths:
      - "Deep-Learning/AI-Foundry-Custom-Code-Training/**"
      - ".github/workflows/ai-foundry-custom-code-training-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: Deep-Learning/AI-Foundry-Custom-Code-Training

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            Deep-Learning/AI-Foundry-Custom-Code-Training/requirements.txt
            Deep-Learning/AI-Foundry-Custom-Code-Training/requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install --no-input -r requirements-dev.txt

      - name: Verify dependency graph
        run: python -m pip check

      - name: Verify SDK identity
        run: |
          python - <<'PY'
          from importlib import metadata
          expected = {
              "azure-ai-projects": "2.3.0a20260525001",
              "azure-identity": "1.26.0b2",
              "pytest": "9.1.1",
          }
          actual = {name: metadata.version(name) for name in expected}
          print(actual)
          assert actual == expected
          PY

      - name: Compile all Python sources
        run: >-
          python -m compileall -q
          scripts tools patches tests docker/verify_stack.py

      - name: Run unit and refusal-path tests
        run: python -m pytest tests -q

      - name: Run deterministic repository gate
        run: python scripts/validate_repo.py

      - name: Check consolidated Dockerfile
        if: matrix.python-version == '3.11'
        run: docker buildx build --check --file docker/Dockerfile .
