name: Foundry Long-Running Agent Resilience CI

on:
  push:
    branches: [master]
    paths:
      - "Agents/Foundry-Long-Running-Agent-Resilience/**"
      - "Agents/README.md"
      - "LICENSE"
      - ".github/workflows/foundry-long-running-agent-resilience-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "Agents/Foundry-Long-Running-Agent-Resilience/**"
      - "Agents/README.md"
      - "LICENSE"
      - ".github/workflows/foundry-long-running-agent-resilience-ci.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Agents/Foundry-Long-Running-Agent-Resilience
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            Agents/Foundry-Long-Running-Agent-Resilience/requirements.txt
            Agents/Foundry-Long-Running-Agent-Resilience/requirements-dev.txt
            Agents/Foundry-Long-Running-Agent-Resilience/pyproject.toml
      - run: python -m pip install --upgrade pip setuptools==83.0.0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python scripts/check_lfs_pointers.py
      - run: python scripts/build_public_evidence.py
      - run: git diff --exit-code -- data/evidence-contract.schema.json data/validation-matrix.json evidence/manifest.json
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
      - run: python scripts/validate_evidence.py
      - run: python scripts/protocol_summary_differential.py
      - run: python scripts/validate_readmes.py
      - run: python scripts/validate_repo.py
      - run: ruff check src tests scripts
      - run: pytest -q tests
      - run: pip-audit --local --progress-spinner off
      - run: python -m build --wheel
      - run: python -m pip install --force-reinstall dist/foundry_long_running_agent_resilience-0.2.0-py3-none-any.whl
      - run: lra-evidence --help
      - run: python scripts/package_smoke.py
      - run: python -m pip check
