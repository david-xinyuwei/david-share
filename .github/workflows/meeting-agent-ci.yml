name: Meeting Agent CI

on:
  push:
    branches: [master]
    paths:
      - "Agents/Meeting-Agent/**"
      - ".github/workflows/meeting-agent-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "Agents/Meeting-Agent/**"
      - ".github/workflows/meeting-agent-ci.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Agents/Meeting-Agent
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            Agents/Meeting-Agent/requirements.txt
            Agents/Meeting-Agent/requirements-dev.txt
            Agents/Meeting-Agent/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python scripts/audit_no_send.py
      - run: python scripts/audit_public_content.py
      - run: python scripts/validate_evidence.py
      - run: python scripts/validate_sample_runs.py
      - run: python scripts/validate_readmes.py
      - run: python scripts/pre_delivery_check.py
      - run: ruff check src tests scripts
      - run: pytest
      - run: pip-audit -r requirements.txt --progress-spinner off