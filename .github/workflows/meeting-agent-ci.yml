name: Meeting Agent CI

on:
  push:
    branches: [master]
    paths:
      - "Agents/Meeting-Agent/**"
      - ".github/workflows/meeting-agent-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "Agents/Meeting-Agent/**"
      - ".github/workflows/meeting-agent-ci.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Agents/Meeting-Agent
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          lfs: true
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            Agents/Meeting-Agent/requirements.txt
            Agents/Meeting-Agent/requirements-dev.txt
            Agents/Meeting-Agent/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python scripts/audit_no_send.py
      - run: python scripts/audit_public_content.py
      - run: python scripts/validate_evidence.py
      - run: python scripts/validate_sample_runs.py
      - run: python scripts/validate_readmes.py
      - run: python scripts/pre_delivery_check.py
      - run: ruff check src tests scripts main.py
      - run: pytest
      - run: pip-audit -r requirements.txt --progress-spinner off
      - run: python -m build --wheel
      - run: python -m pip check

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Agents/Meeting-Agent/ui
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          lfs: true
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            Agents/Meeting-Agent/requirements.txt
            Agents/Meeting-Agent/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Agents/Meeting-Agent/ui/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r ../requirements-dev.txt
      - run: python -m pip install -e ..
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: python ../scripts/run_ui_e2e.py
      - run: npm audit --omit=dev --audit-level=high