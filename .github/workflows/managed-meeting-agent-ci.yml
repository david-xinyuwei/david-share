name: Managed Agent CI

on:
  push:
    branches: [master]
    paths:
      - "Agents/Meeting-Agent/managed-agent/**"
      - ".github/workflows/managed-meeting-agent-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "Agents/Meeting-Agent/managed-agent/**"
      - ".github/workflows/managed-meeting-agent-ci.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Agents/Meeting-Agent/managed-agent
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Agents/Meeting-Agent/managed-agent/requirements.txt
            Agents/Meeting-Agent/managed-agent/requirements-dev.txt
            Agents/Meeting-Agent/managed-agent/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python scripts/validate_public_tree.py
      - run: ruff check src tests scripts main.py
      - run: pytest -q
      - run: pip-audit -r requirements-dev.txt --progress-spinner off
      - run: python -m build --wheel
      - run: python -m pip check

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Agents/Meeting-Agent/managed-agent/ui
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Agents/Meeting-Agent/managed-agent/requirements.txt
            Agents/Meeting-Agent/managed-agent/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Agents/Meeting-Agent/managed-agent/ui/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r ../requirements-dev.txt
      - run: python -m pip install -e ..
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: MEETING_AGENT_E2E_MODE=fixture python ../scripts/run_ui_e2e.py
      - run: npm audit --omit=dev --audit-level=high
