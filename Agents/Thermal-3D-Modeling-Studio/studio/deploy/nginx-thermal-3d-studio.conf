# TLS front for the studio (uvicorn on 127.0.0.1:3005). bootstrap_vm.sh replaces __FQDN__ with the public host name.
server {
    listen 80;
    listen [::]:80;
    server_name __FQDN__;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __FQDN__;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/__FQDN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FQDN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64m;   # render / proposal requests carry PNG data URLs

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;        # SSE progress streams (generation, CAD, render)
        gzip off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
