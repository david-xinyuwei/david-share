<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>test topology</title>
<!-- Source of images/test-topology-{en,zh}.png. Render with: python tools/build_diagram.py
     Machine facts: evidence/run-20261113/machine.json and browser/capture.json; Track A facts: studio/cache/*.json. -->
<style>
  :root { --azure: #0078D4; --lane: #F3F2F1; --line: #E1DFDD; --ink: #201F1E; --muted: #605E5C; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1000px; overflow: hidden; background: #fff; color: var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; }
  .title { position: absolute; left: 0; top: 0; width: 1920px; height: 64px; background: var(--azure); color: #fff;
    display: flex; align-items: center; padding: 0 40px; }
  .title h1 { font-size: 30px; font-weight: 600; }
  .title .model { margin-left: auto; font-size: 21px; }
  .row { position: absolute; left: 40px; width: 1840px; height: 262px; display: grid; grid-template-columns: 190px 1630px; column-gap: 20px; }
  .track { display: flex; flex-direction: column; justify-content: center; gap: 6px; overflow: hidden; }
  .num { width: 46px; height: 46px; border-radius: 50%; background: var(--azure); color: #fff; font-size: 26px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; }
  .track b { font-size: 24px; }
  .track span { font-size: 17px; color: var(--muted); line-height: 1.3; white-space: pre-line; }
  .body { display: flex; flex-direction: column; gap: 8px; }
  .boxes { height: 210px; display: flex; }
  .box { background: var(--lane); border-radius: 10px; padding: 8px 14px 12px; display: flex; flex-direction: column; gap: 8px;
    overflow: hidden; border: 2px solid var(--lane); }
  .box.unknown { border: 2px dashed #8A8886; }
  .bh { font-size: 19px; font-weight: 600; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .bh img { height: 30px; }
  .bh span { font-weight: 400; color: var(--muted); font-size: 17px; }
  .cards { flex: 1; display: flex; }
  .card { flex: 1; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 16px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .08); display: flex; flex-direction: column; justify-content: center; gap: 3px; overflow: hidden; }
  .card h3 { font-size: 21px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h3 img { height: 24px; }
  .card p { font-size: 17px; color: var(--muted); line-height: 1.3; }
  .call { width: 48px; flex: none; display: flex; align-items: center; justify-content: center; }
  .net { width: 96px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: 15px; color: var(--azure); text-align: center; }
  .clock { height: 44px; background: #FFF4CE; border: 1px solid #E6C700; border-radius: 8px; display: flex; align-items: center;
    gap: 10px; padding: 0 14px; font-size: 17px; white-space: nowrap; overflow: hidden; }
  .clock svg { flex: none; }
  .foot { position: absolute; left: 40px; top: 906px; width: 1840px; height: 88px; display: flex; align-items: center; gap: 24px;
    border-top: 1px solid var(--line); padding-top: 6px; }
  .foot .note { font-size: 17px; color: var(--muted); line-height: 1.35; width: 1080px; }
  .foot .right { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .foot .legend { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--muted); }
  .foot .legend svg { margin-left: 12px; }
  .foot .orig { font-size: 15px; color: var(--muted); }
</style>
</head>
<body>
<div class="title"><h1 data-k="title"></h1><div class="model" data-k="model"></div></div>

<div class="row" style="top:80px">
  <div class="track"><div class="num">A</div><b data-k="tA"></b><span data-k="tA_sub"></span></div>
  <div class="body">
    <div class="boxes">
      <div class="box unknown" style="width:900px">
        <div class="bh"><span class="h" data-k="client"></span><span data-k="client_sub"></span></div>
        <div class="cards">
          <div class="card"><h3>pregen.py</h3><p data-k="a1"></p></div>
          <div class="call"><svg width="44" height="20"><use href="#call"/></svg></div>
          <div class="card"><h3>run_generation()</h3><p data-k="a2"></p></div>
        </div>
      </div>
      <div class="net"><svg width="80" height="70"><use href="#arrows"/></svg><span data-k="net"></span></div>
      <div class="box" style="width:634px">

        </div>
      </div>
    </div>
    <div class="clock"><svg width="24" height="24"><use href="#clock"/></svg><span data-k="clockA"></span></div>
  </div>
</div>

          <div class="card"><h3>pregen_cad.py</h3><p data-k="b1"></p></div>
          <div class="call"><svg width="44" height="20"><use href="#call"/></svg></div>

        </div>
      </div>

</div>

    <div class="boxes">

        <div class="cards">
          <div class="card"><h3>pregen_engineering.py</h3><p data-k="c1"></p></div>

      </div>
    </div>
    <div class="clock"><svg width="24" height="24"><use href="#clock"/></svg><span data-k="clockC"></span></div>
  </div>
</div>

<div class="foot">
  <div class="note" data-k="note"></div>
  <div class="right">
    <div class="legend">
      <svg width="40" height="12"><line x1="2" y1="6" x2="34" y2="6" stroke="#0078D4" stroke-width="3" marker-end="url(#head)"/></svg><span data-k="req"></span>
      <svg width="40" height="12"><line x1="2" y1="6" x2="34" y2="6" stroke="#0078D4" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#head)"/></svg><span data-k="resp"></span>
      <svg width="40" height="20"><rect x="2" y="2" width="34" height="16" rx="4" fill="#F3F2F1" stroke="#8A8886" stroke-width="2" stroke-dasharray="5 3"/></svg><span data-k="unknown"></span>
      <svg width="30" height="20"><rect x="2" y="2" width="24" height="16" rx="4" fill="#FFF4CE" stroke="#E6C700"/></svg><span data-k="clock"></span>
    </div>
    <div class="orig" data-k="orig"></div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker>
    <g id="arrows">
      <line x1="6" y1="24" x2="72" y2="24" stroke="#0078D4" stroke-width="3.5" marker-end="url(#head)"/>
      <line x1="74" y1="48" x2="8" y2="48" stroke="#0078D4" stroke-width="3.5" stroke-dasharray="7 5" marker-end="url(#head)"/>
    </g>
    <g id="call"><line x1="4" y1="10" x2="38" y2="10" stroke="#0078D4" stroke-width="3.5" marker-end="url(#head)"/></g>
    <g id="clock"><circle cx="12" cy="12" r="9.5" fill="#fff" stroke="#8A6D00" stroke-width="2"/>
      <path d="M12 6.5 V12 L16 14.5" fill="none" stroke="#8A6D00" stroke-width="2" stroke-linecap="round"/></g>
