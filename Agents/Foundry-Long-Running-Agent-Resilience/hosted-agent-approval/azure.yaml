# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: lre-approval-gate
services:
  ai-project:
    host: azure.ai.project
    deployments: []
    endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
  lre-approval-gate:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Invocations Protocol
        - Bring Your Own
        - Human-in-the-Loop
        - Long-Running
        - Resilient Tasks
        - Fault Injection
        - Python
    project: src/resilient-approval-gate
    language: python
    codeConfiguration:
      dependencyResolution: remote_build
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: lre-approval-gate
    displayName: LRA Approval Gate Agent
    description: >-
      Non-production Hosted Agent built on the resilient multi-turn task
      primitive. Translates a sample batch of the shared 30-section document,
      suspends for human review, survives instance loss while waiting, and
      finishes the remaining sections after the reviewer approves.
    protocols:
      - protocol: invocations
        version: 2.0.0
    env:
      LRE_ENABLE_FAULT_INJECTION: ${LRE_ENABLE_FAULT_INJECTION}
      LRE_STAGE_DELAY_MS: ${LRE_STAGE_DELAY_MS}
      LRA_TRANSLATOR_ENDPOINT: ${LRA_TRANSLATOR_ENDPOINT}
      LRA_TRANSLATOR_REGION: ${LRA_TRANSLATOR_REGION}
      LRA_TRANSLATOR_RESOURCE_ID: ${LRA_TRANSLATOR_RESOURCE_ID}
    container:
      resources:
        cpu: '1'
        memory: 2Gi
infra:
  provider: microsoft.foundry
