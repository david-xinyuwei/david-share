<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized non-attributed prompt-cache observation</title>
  <desc id="desc">After warm-up, 11520 of 13037 input tokens were reported as cache reads, which is 88.4 percent. The first call took 5820 ms and the warm calls averaged 3642.4 ms, a reduction of 2177.6 ms or 37.4 percent. Both default prompt caching and Azure Context Cache were active, so these values cannot be attributed to Context Cache.</desc>
  <rect width="1600" height="900" fill="#f7f9fb"/>
  <text x="800" y="76" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="42" font-weight="700" fill="#101828">Non-Attributed Single-Run Observation</text>
  <text x="800" y="124" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" fill="#475467">Recomputed from the six checked-in calls of the official Responses API demo</text>

  <line x1="800" y1="170" x2="800" y2="700" stroke="#d0d5dd" stroke-width="2"/>

  <text x="400" y="212" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="27" font-weight="600" fill="#101828">Input processing reuse</text>
  <text x="400" y="248" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" fill="#475467">Input tokens after warm-up</text>
  <rect x="100" y="290" width="600" height="88" fill="#e4e7ec"/>
  <rect x="100" y="290" width="530" height="88" fill="#107c41"/>
  <text x="365" y="345" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700" fill="#ffffff">11,520 cache reads</text>
  <text x="665" y="345" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#475467">1,517</text>
  <text x="100" y="412" font-family="Segoe UI, sans-serif" font-size="18" fill="#667085">Reused</text>
  <text x="700" y="412" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="18" fill="#667085">Full price</text>
  <text x="400" y="500" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="66" font-weight="700" fill="#107c41">88.4%</text>
  <text x="400" y="546" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" fill="#475467">of 13,037 input tokens billed as cache reads</text>
  <text x="400" y="580" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" fill="#667085">per call 85.9% to 90.7%; not an 88.4% bill reduction</text>

  <text x="1200" y="212" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="27" font-weight="600" fill="#101828">Directional latency</text>
  <text x="1200" y="248" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" fill="#475467">First call vs warm-call mean</text>
  <line x1="960" y1="600" x2="1460" y2="600" stroke="#d0d5dd" stroke-width="2"/>
  <rect x="1000" y="300" width="120" height="300" fill="#98a2b3"/>
  <rect x="1250" y="412" width="120" height="188" fill="#107c41"/>
  <text x="1060" y="286" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#101828">5,820 ms</text>
  <text x="1310" y="398" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#107c41">3,642.4 ms</text>
  <text x="1060" y="632" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" fill="#475467">Call 1 (cold)</text>
  <text x="1310" y="632" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" fill="#475467">Calls 2-6 (mean)</text>
  <text x="1200" y="690" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#107c41">lower by 2,177.6 ms (37.4%)</text>

  <rect x="200" y="752" width="1200" height="84" rx="10" fill="#fff8e6" stroke="#f0c36d" stroke-width="2"/>
  <text x="800" y="784" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="21" font-weight="600" fill="#7a4f01">Default prompt caching and Azure Context Cache were both active</text>
  <text x="800" y="814" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="19" fill="#7a4f01">Not evidence of incremental Context Cache hit rate, latency, or savings</text>
</svg>
