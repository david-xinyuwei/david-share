<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Azure Context Cache customer application architecture</title>
  <desc id="desc">Enterprise channels send requests to a customer AI application that places stable reusable context before dynamic request data. A cache-linked Azure OpenAI deployment consults the Microsoft.Storage contextCaches child container named default-container in the customer subscription and returns responses with cache usage telemetry.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5d6b76"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#18794e"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fb"/>
  <text x="800" y="60" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#16202a">Customer Application Architecture</text>
  <text x="800" y="100" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" fill="#52616d">Reuse stable context across requests; keep changing task data at the end of the prompt</text>

  <rect x="52" y="196" width="230" height="310" rx="8" fill="#174666" stroke="#0b2f49" stroke-width="3"/>
  <text x="167" y="244" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#ffffff">ENTERPRISE</text>
  <text x="167" y="278" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#ffffff">CHANNELS</text>
  <text x="167" y="365" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#ffffff">Customer support</text>
  <text x="167" y="397" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#ffffff">Agent workflows</text>
  <text x="167" y="429" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#ffffff">Code / compliance review</text>
  <text x="167" y="461" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#ffffff">Document-heavy apps</text>

  <rect x="344" y="150" width="390" height="408" rx="8" fill="#ffffff" stroke="#2463a7" stroke-width="3"/>
  <text x="539" y="198" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#123b5d">CUSTOMER AI APPLICATION</text>

  <rect x="378" y="262" width="322" height="140" rx="6" fill="#e8f1fb" stroke="#4f86c6" stroke-width="2"/>
  <text x="539" y="298" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#123b5d">STABLE PREFIX</text>
  <text x="539" y="333" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" fill="#274f70">Instructions · tool catalog · policies</text>
  <text x="539" y="362" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" fill="#274f70">Few-shot examples · shared reference</text>
  <text x="539" y="389" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#526b7e">Keep byte-identical across related requests</text>

  <rect x="378" y="426" width="322" height="100" rx="6" fill="#fff2cc" stroke="#b77900" stroke-width="2"/>
  <text x="539" y="462" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#5a3a00">DYNAMIC SUFFIX</text>
  <text x="539" y="497" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" fill="#684b14">User task · current case data · new turn</text>

  <rect x="790" y="132" width="750" height="474" rx="10" fill="#f3f7f4" stroke="#7b9182" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="1165" y="174" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#344b3a">CUSTOMER AZURE SUBSCRIPTION · REGION · RBAC</text>

  <rect x="820" y="226" width="286" height="220" rx="8" fill="#ddf1e3" stroke="#247a45" stroke-width="3"/>
  <text x="963" y="266" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#123a24">AZURE OPENAI</text>
  <text x="963" y="296" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#123a24">DEPLOYMENT</text>
  <text x="963" y="328" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#2c5c3d">Microsoft.CognitiveServices/accounts</text>
  <text x="963" y="356" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#2c5c3d">&lt;prefix&gt;-aoai</text>
  <text x="963" y="383" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#2c5c3d">context-cache-deployment</text>
  <text x="963" y="410" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#2c5c3d">gpt-5.4 · Responses API</text>
  <text x="963" y="433" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#2c5c3d">binding: contextCacheContainerId</text>

  <rect x="1242" y="226" width="264" height="220" rx="8" fill="#e9e2f5" stroke="#7650a6" stroke-width="3"/>
  <text x="1374" y="266" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#3f2760">AZURE CONTEXT</text>
  <text x="1374" y="296" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#3f2760">CACHE</text>
  <text x="1374" y="328" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" fill="#574171">Microsoft.Storage/contextCaches</text>
  <text x="1374" y="356" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" fill="#574171">&lt;prefix&gt;-cache</text>
  <text x="1374" y="383" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#574171">child: default-container</text>
  <text x="1374" y="410" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#574171">OpenAI · gpt-5.4 · TTL 7d</text>
  <text x="1374" y="433" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#574171">not Blob Storage</text>

  <rect x="952" y="476" width="416" height="92" rx="6" fill="#ffffff" stroke="#5d8068" stroke-width="2"/>
  <text x="1160" y="511" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#294834">RESPONSE + USAGE TELEMETRY</text>
  <text x="1160" y="542" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#486351">Model output · cached_tokens · latency · request outcome</text>

  <g fill="none" stroke="#5d6b76" stroke-width="5" marker-end="url(#arrow)">
    <path d="M282 351 H344"/>
    <path d="M734 351 H820"/>
    <path d="M963 446 V476"/>
    <path d="M952 522 H742 V490 H704"/>
  </g>
  <g fill="none" stroke="#18794e" stroke-width="5" marker-end="url(#arrowGreen)">
    <path d="M1106 306 H1242"/>
    <path d="M1242 376 H1106"/>
  </g>
  <text x="1174" y="282" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#18794e">lookup / miss: populate →</text>
  <text x="1174" y="407" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#18794e">← hit: reuse processed prefix</text>

  <rect x="60" y="608" width="684" height="118" rx="6" fill="#e8f1fb" stroke="#4f86c6" stroke-width="2"/>
  <text x="402" y="640" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#123b5d">CUSTOMER RESPONSIBILITY</text>
  <text x="402" y="672" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#274f70">Prompt structure · case data · subscription and region</text>
  <text x="402" y="701" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#274f70">RBAC and TTL policy · telemetry analysis</text>

  <rect x="820" y="608" width="690" height="118" rx="6" fill="#e9e2f5" stroke="#7650a6" stroke-width="2"/>
  <text x="1165" y="640" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#3f2760">AZURE-MANAGED SERVICE</text>
  <text x="1165" y="672" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#574171">Model execution · prefix matching</text>
  <text x="1165" y="701" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#574171">Cache serving and population</text>

  <rect x="250" y="774" width="1100" height="70" rx="6" fill="#fffaf0" stroke="#c58b22" stroke-width="2"/>
  <text x="800" y="805" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#5a3a00">CUSTOMER EVALUATION</text>
  <text x="800" y="831" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#6c5940">Measure latency, cached-token economics, and throughput with representative traffic and current pricing.</text>
</svg>