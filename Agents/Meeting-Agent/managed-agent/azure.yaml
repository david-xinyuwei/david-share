# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=0.1.0-preview'
name: managed-meeting-agent
services:
    managed-meeting-agent:
        project: .
        host: azure.ai.agent
        config:
            deployments:
                - model:
                      format: OpenAI
                      name: gpt-5.4
                      version: "2026-03-05"
                  name: gpt-5.4
                  sku:
                      capacity: 100
                      name: GlobalStandard
            promptAgent:
                apiVersion: v1
                baseUrl: https://ai.azure.com/api
                modelEndpoint: ${AZURE_AI_MODEL_ENDPOINT}
                projectEndpoint: ${AZURE_AI_PROJECT_ENDPOINT}
                resourceGroup: ${AZURE_RESOURCE_GROUP}
                subscriptionId: ${AZURE_SUBSCRIPTION_ID}
                workspace: ${AZURE_AI_PROJECT_NAME}