# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
    azure.ai.agents: '0.1.46-preview'
name: managed-meeting-agent
services:
    managed-meeting-agent:
        project: .
        host: azure.ai.agent
        config:
            deployments:
                - model:
                      format: MoonshotAI
                      name: Kimi-K2.7-Code
                      version: "2026-06-12"
                  name: Kimi-K2.7-Code
                  sku:
                      capacity: 50
                      name: GlobalStandard
            promptAgent:
                apiVersion: v1
                baseUrl: https://ai.azure.com/api
                modelEndpoint: ${AZURE_AI_MODEL_ENDPOINT}
                projectEndpoint: ${AZURE_AI_PROJECT_ENDPOINT}
                resourceGroup: ${AZURE_RESOURCE_GROUP}
                subscriptionId: ${AZURE_SUBSCRIPTION_ID}
                workspace: ${AZURE_AI_PROJECT_NAME}