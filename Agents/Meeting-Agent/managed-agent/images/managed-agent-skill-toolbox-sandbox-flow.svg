<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0078D4"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5C2D91"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#F7630C"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#107C10"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".14"/></filter>
    <style>.title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#242424}.subtitle{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#605E5C}.section{font:700 19px 'Segoe UI',Arial,sans-serif;fill:#242424}.boxTitle{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#242424}.body{font:400 17px 'Segoe UI',Arial,sans-serif;fill:#323130}.small{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#605E5C}.label{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#323130}.mono{font:400 15px Consolas,monospace;fill:#323130}</style>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/><text x="60" y="62" class="title">Managed Agent: Skill, Toolbox, and Sandbox</text><text x="60" y="94" class="subtitle">Configuration relationships are separate from runtime call direction · Managed Harness owns runtime control</text>
  <rect x="50" y="125" width="1500" height="235" rx="18" fill="#FAF9F8" stroke="#A19F9D" stroke-width="2" stroke-dasharray="9 7"/><rect x="72" y="142" width="330" height="34" rx="17" fill="#EDEBE9"/><text x="92" y="166" class="section">① Configuration / publishing (not call direction)</text>
  <rect x="105" y="205" width="360" height="120" rx="14" fill="#CFE4FA" stroke="#0078D4" stroke-width="2" filter="url(#shadow)"/><text x="130" y="238" class="boxTitle">Skill Package</text><text x="130" y="268" class="mono">SKILL.md · references/ · assets/</text><text x="130" y="294" class="mono">scripts/ (optional)</text>
  <line x1="465" y1="265" x2="615" y2="265" stroke="#0078D4" stroke-width="3" marker-end="url(#blue)"/><text x="505" y="247" class="label">publish version</text>
  <rect x="620" y="205" width="330" height="120" rx="14" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2" filter="url(#shadow)"/><text x="648" y="240" class="boxTitle">Foundry Skill Version</text><text x="648" y="270" class="body">immutable · default version</text><text x="648" y="296" class="body">downloadable · auditable · rollback-ready</text>
  <line x1="950" y1="265" x2="1085" y2="265" stroke="#5C2D91" stroke-width="3" marker-end="url(#purple)"/><text x="978" y="247" class="label">Skill reference</text>
  <rect x="1090" y="195" width="380" height="140" rx="14" fill="#FFF4CE" stroke="#F7630C" stroke-width="2" filter="url(#shadow)"/><text x="1118" y="230" class="boxTitle">Toolbox Version</text><text x="1118" y="260" class="body">Skills · Tools/MCP · Connections</text><text x="1118" y="286" class="body">Tool Search · Policies · Versioning</text><text x="1118" y="312" class="small">central publishing, discovery, auth, governance</text>
  <rect x="50" y="390" width="1500" height="480" rx="18" fill="#fff" stroke="#0078D4" stroke-width="2"/><rect x="72" y="407" width="320" height="34" rx="17" fill="#CFE4FA"/><text x="92" y="431" class="section">② Runtime control flow (correct direction)</text>
  <rect x="90" y="535" width="210" height="100" rx="50" fill="#F3F2F1" stroke="#605E5C" stroke-width="2"/><text x="195" y="575" text-anchor="middle" class="boxTitle">User / Product UI</text><text x="195" y="604" text-anchor="middle" class="small">request and input files</text>
  <line x1="300" y1="585" x2="410" y2="585" stroke="#0078D4" stroke-width="3" marker-end="url(#blue)"/><text x="323" y="565" class="label">invoke Agent</text>
  <rect x="415" y="510" width="330" height="150" rx="16" fill="#DFF6DD" stroke="#107C10" stroke-width="3" filter="url(#shadow)"/><text x="580" y="548" text-anchor="middle" class="boxTitle">Managed Harness</text><text x="580" y="578" text-anchor="middle" class="body">runtime controller</text><text x="580" y="606" text-anchor="middle" class="small">model loop · capability selection · scheduling</text><text x="580" y="632" text-anchor="middle" class="small">Foundry-managed; no customer runtime ops</text>
  <path d="M745 550C820 500 850 485 920 485" fill="none" stroke="#F7630C" stroke-width="3" marker-end="url(#orange)"/><path d="M920 535C850 535 820 555 745 575" fill="none" stroke="#F7630C" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#orange)"/><text x="770" y="490" class="label">discover / load / invoke</text><text x="770" y="548" class="small">Skill content or Tool result returns</text>
  <rect x="925" y="450" width="360" height="120" rx="14" fill="#FFF4CE" stroke="#F7630C" stroke-width="2" filter="url(#shadow)"/><text x="1105" y="486" text-anchor="middle" class="boxTitle">Toolbox MCP Endpoint</text><text x="1105" y="516" text-anchor="middle" class="body">Skill Resources · Tools/MCP</text><text x="1105" y="543" text-anchor="middle" class="small">catalog and governance surface, not execution</text>
  <line x1="1285" y1="510" x2="1385" y2="510" stroke="#5C2D91" stroke-width="3" marker-end="url(#purple)"/><rect x="1390" y="458" width="130" height="104" rx="14" fill="#E8DAEF" stroke="#5C2D91" stroke-width="2"/><text x="1455" y="493" text-anchor="middle" class="boxTitle">Services</text><text x="1455" y="522" text-anchor="middle" class="small">API / DB</text><text x="1455" y="545" text-anchor="middle" class="small">MCP Tool</text>
  <path d="M690 660C730 710 785 735 860 735" fill="none" stroke="#0078D4" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><path d="M860 785C785 785 730 760 690 705" fill="none" stroke="#0078D4" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#blue)"/><text x="712" y="707" class="label">conditional: code Tool configured</text><text x="720" y="785" class="small">conditional results return</text>
  <rect x="865" y="680" width="420" height="140" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3" stroke-dasharray="8 6" filter="url(#shadow)"/><text x="1075" y="718" text-anchor="middle" class="boxTitle">Managed Sandbox (conditional)</text><text x="1075" y="750" text-anchor="middle" class="body">requires an explicitly configured capability</text><text x="1075" y="780" text-anchor="middle" class="small">isolated code / file execution when supported</text><text x="1075" y="804" text-anchor="middle" class="small">not configured by this Meeting Agent v9</text>
  <path d="M580 660C540 745 420 785 300 785" fill="none" stroke="#107C10" stroke-width="3" marker-end="url(#green)"/><rect x="90" y="740" width="210" height="90" rx="14" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/><text x="195" y="776" text-anchor="middle" class="boxTitle">Response / Artifacts</text><text x="195" y="805" text-anchor="middle" class="small">text · files · status</text>
  <rect x="50" y="895" width="1500" height="75" rx="14" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/><text x="75" y="925" class="section">Current Meeting Agent v9:</text><text x="350" y="925" class="body">Validated Managed Harness + Toolbox v5 + two Skill v3 packages; cloud returns MeetingAnalysis / DeckPlan.</text><text x="350" y="951" class="body">PPTX / EML rendering remains local; this implementation does not run its scripts in Managed Sandbox.</text>
</svg>
