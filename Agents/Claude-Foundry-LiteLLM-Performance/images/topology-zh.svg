<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" fill="#FFFFFF"/>
<g font-family="'Segoe UI', Aptos, 'Segoe Sans Display', system-ui, -apple-system, 'Helvetica Neue', Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
<text x="40" y="62" font-size="36" fill="#111111" font-weight="400" text-anchor="start">测试方法：一个区域、一个客户端、一个资源</text>
<rect x="40" y="92" width="760" height="444" rx="24" fill="none" stroke="#432FC8" stroke-width="2.5" stroke-dasharray="12 8"/>
<text x="62" y="127" font-size="20" fill="#432FC8" font-weight="700" text-anchor="start">Azure 区域：East US 2</text>
<rect x="62" y="146" width="270" height="256" rx="16" fill="#ECECEC"/>
<image x="181" y="156" width="32" height="32" href="data:image/svg+xml;base64,"/>
<text x="197" y="214" font-size="21" fill="#0408AC" font-weight="700" text-anchor="middle">Linux VM</text>
<text x="197" y="239" font-size="16" fill="#666666" font-weight="400" text-anchor="middle">唯一的客户端</text>
<text x="197" y="270" font-size="17" fill="#252525" font-weight="700" text-anchor="middle">Python 3.12 + httpx</text>
<text x="197" y="295" font-size="17" fill="#252525" font-weight="400" text-anchor="middle">Messages API，流式返回</text>
<text x="197" y="320" font-size="17" fill="#252525" font-weight="400" text-anchor="middle">每个模型同时只有 1 个请求</text>
<text x="197" y="345" font-size="17" fill="#252525" font-weight="400" text-anchor="middle">托管身份，不用 API 密钥</text>
<text x="197" y="377" font-size="14.5" fill="#666666" font-weight="400" text-anchor="middle">TCP 建连 ≥ 50 毫秒就停止</text>
<line x1="197" y1="404" x2="197" y2="424" stroke="#C88A1E" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="191,423 203,423 197,434" fill="#C88A1E"/>
<text x="208" y="424" font-size="14.5" fill="#A35F00" font-weight="400" text-anchor="start">回答</text>
<rect x="62" y="436" width="270" height="84" rx="10" fill="#FFF6E5" stroke="#C88A1E" stroke-width="1.6" stroke-dasharray="7 4"/>
<text x="197" y="463" font-size="17" fill="#A35F00" font-weight="700" text-anchor="middle">Docker 评分 · 同一台 VM</text>
<text x="197" y="486" font-size="15" fill="#252525" font-weight="400" text-anchor="middle">运行每道题自带的单元测试</text>
<text x="197" y="508" font-size="15" fill="#252525" font-weight="400" text-anchor="middle">离线运行 · 以 0 退出即通过</text>
<text x="400" y="232" font-size="16" fill="#432FC8" font-weight="700" text-anchor="middle">HTTPS</text>
<text x="400" y="254" font-size="15" fill="#666666" font-weight="400" text-anchor="middle">TCP 建连</text>
<text x="400" y="274" font-size="15" fill="#666666" font-weight="400" text-anchor="middle">中位数 9.7 毫秒</text>
<line x1="346" y1="292" x2="454" y2="292" stroke="#432FC8" stroke-width="2.5"/>
<polygon points="336,292 348,286 348,298" fill="#432FC8"/>
<polygon points="464,292 452,286 452,298" fill="#432FC8"/>
<rect x="468" y="146" width="312" height="374" rx="18" fill="#EFECFA" stroke="#C4BFF3" stroke-width="1.5"/>
<image x="484" y="160" width="28" height="28" href="data:image/svg+xml;base64,"/>
<text x="520" y="182" font-size="20" fill="#0408AC" font-weight="700" text-anchor="start">一个 Foundry 资源</text>
<text x="484" y="208" font-size="14.5" fill="#666666" font-weight="400" text-anchor="start">GlobalStandard 部署，版本 2</text>
<rect x="484" y="222" width="280" height="58" rx="8" fill="#FFFFFF" stroke="#DAD5F4"/>
<text x="498" y="246" font-size="17" fill="#0408AC" font-weight="700" text-anchor="start">Opus 5.5</text>
<text x="750" y="246" font-size="14" fill="#666666" font-weight="400" text-anchor="end">40K TPM</text>
<text x="498" y="268" font-size="15" fill="#432FC8" font-weight="400" text-anchor="start">adaptive：low → max</text>
<rect x="484" y="290" width="280" height="80" rx="8" fill="#FFFFFF" stroke="#DAD5F4"/>
<text x="498" y="314" font-size="17" fill="#0408AC" font-weight="700" text-anchor="start">Sonnet 5.5</text>
<text x="750" y="314" font-size="14" fill="#666666" font-weight="400" text-anchor="end">80K TPM</text>
<text x="498" y="336" font-size="15" fill="#432FC8" font-weight="400" text-anchor="start">adaptive：low → max</text>
<text x="498" y="357" font-size="15" fill="#432FC8" font-weight="400" text-anchor="start">between_tools：low → high</text>
<rect x="484" y="380" width="280" height="80" rx="8" fill="#FFFFFF" stroke="#DAD5F4"/>
<text x="498" y="404" font-size="17" fill="#0408AC" font-weight="700" text-anchor="start">Haiku 5.5</text>
<text x="750" y="404" font-size="14" fill="#666666" font-weight="400" text-anchor="end">80K TPM</text>
<text x="498" y="426" font-size="15" fill="#432FC8" font-weight="400" text-anchor="start">adaptive：low → max</text>
<text x="498" y="447" font-size="15" fill="#432FC8" font-weight="400" text-anchor="start">disabled：low → high</text>
<text x="484" y="500" font-size="14.5" fill="#252525"><tspan font-weight="700" fill="#0408AC">Messages API </tspan><tspan font-weight="400">/anthropic/v1/messages</tspan></text>
<text x="836" y="127" font-size="32" fill="#0408AC" font-weight="700" text-anchor="start">方法</text>
<defs><linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C4BFF3"/><stop offset="1" stop-color="#432FC8"/></linearGradient></defs>
<circle cx="853" cy="172" r="17" fill="url(#badge)"/>
<text x="853" y="178" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="882" y="178" font-size="17" fill="#0408AC" font-weight="700" text-anchor="start">18 道题，6 种语言</text>
<text x="882" y="201" font-size="15.5" fill="#252525" font-weight="400" text-anchor="start">Aider polyglot，每种语言 3 道；</text>
<text x="882" y="222" font-size="15.5" fill="#252525" font-weight="400" text-anchor="start">公开练习，不是客户数据</text>
<circle cx="853" cy="244" r="17" fill="url(#badge)"/>
<text x="853" y="250" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="882" y="250" font-size="17" fill="#0408AC" font-weight="700" text-anchor="start">先探测接受的取值</text>
<text x="882" y="273" font-size="15.5" fill="#252525" font-weight="400" text-anchor="start">102 个探测请求，返回 200 的</text>
<text x="882" y="294" font-size="15.5" fill="#252525" font-weight="400" text-anchor="start">思考模式 × 档位组合才成为一格</text>
<circle cx="853" cy="316" r="17" fill="url(#badge)"/>
<text x="853" y="322" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="882" y="322" font-size="17" fill="#0408AC" font-weight="700" text-anchor="start">每格每题 3 次</text>
<text x="882" y="345" font-size="15.5" fill="#252525" font-weight="400" text-anchor="start">每格 54 个回答，另加 1 次预热；</text>
<text x="882" y="366" font-size="15.5" fill="#252525" font-weight="400" text-anchor="start">21 格共 1,134 次计分，全部 HTTP 200</text>
<circle cx="853" cy="388" r="17" fill="url(#badge)"/>
<text x="853" y="394" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text x="882" y="394" font-size="17" fill="#0408AC" font-weight="700" text-anchor="start">提示缓存：4 轮编码对话</text>
<text x="882" y="417" font-size="15.5" fill="#252525" font-weight="400" text-anchor="start">264 个请求：断点、TTL、</text>
<text x="882" y="438" font-size="15.5" fill="#252525" font-weight="400" text-anchor="start">切换推理档位和思考模式</text>
<circle cx="853" cy="460" r="17" fill="url(#badge)"/>
<text x="853" y="466" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text x="882" y="466" font-size="17" fill="#0408AC" font-weight="700" text-anchor="start">通过与费用</text>
<text x="882" y="489" font-size="15.5" fill="#252525" font-weight="400" text-anchor="start">通过 = 单元测试以 0 退出，离线运行；</text>
<text x="882" y="510" font-size="15.5" fill="#252525" font-weight="400" text-anchor="start">费用 = 记录的 token × 标价</text>
<text x="40" y="570" font-size="16" fill="#252525"><tspan font-weight="700" fill="#0408AC">GlobalStandard：</tspan><tspan font-weight="400">Azure 可能在其他区域的 GPU 上处理请求，所以“一个区域”指每个模型的入口和网络路径相同，</tspan></text>
<text x="40" y="595" font-size="16" fill="#252525"><tspan font-weight="400">不是同一块 GPU。矩阵的 1,155 个响应，x-ms-region 都是 East US 2，x-ms-is-spilled-over 都是 false。</tspan></text>
<text x="40" y="620" font-size="16" fill="#252525"><tspan font-weight="700" fill="#0408AC">图中未画：</tspan><tspan font-weight="400">2026-10-24 的网关测试（Windows 客户端 → Japan East 的 Azure Container Apps 上的 LiteLLM → 本资源）。</tspan></text>
</g></svg>
