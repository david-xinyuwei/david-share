name: hosted-agent-toolbox-demo
description: >
  A Microsoft Agent Framework hosted agent that consumes a Microsoft Foundry Toolbox.
metadata:
  tags:
    - Agent Framework
    - Foundry Hosted Agents
    - Foundry Toolbox
    - Responses Protocol
template:
  name: hosted-agent-toolbox-demo
  kind: hosted
  protocols:
    - protocol: responses
      version: 1.0.0
  environment_variables:
    - name: AZURE_AI_PROJECT_ENDPOINT
      value: "{{AZURE_AI_PROJECT_ENDPOINT}}"
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
    - name: TOOLBOX_NAME
      value: "{{TOOLBOX_NAME}}"
    - name: ENABLE_DIRECT_WEB_SEARCH
      value: "{{ENABLE_DIRECT_WEB_SEARCH}}"
    - name: MEMORY_STORE_NAME
      value: "{{MEMORY_STORE_NAME}}"
    - name: MEMORY_PROJECT_ENDPOINT
      value: "{{MEMORY_PROJECT_ENDPOINT}}"
    - name: MEMORY_UPDATE_DELAY_SECONDS
      value: "{{MEMORY_UPDATE_DELAY_SECONDS}}"
resources:
  - kind: model
    id: gpt-4.1-mini
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
  - kind: toolbox
    name: agent-tools
    tools:
      - type: code_interpreter
        name: code_interpreter
      - type: file_search
        name: file_search
      - type: web_search
        name: web_search
