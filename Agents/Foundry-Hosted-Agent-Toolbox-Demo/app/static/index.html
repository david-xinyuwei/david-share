<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foundry Agent + Toolbox Demo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f23; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
header { background: linear-gradient(135deg, #1a1a3e 0%, #0078d4 100%); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
header h1 { font-size: 20px; font-weight: 600; color: #fff; }
header .badge { background: #00b04f; color: #fff; padding: 2px 10px; border-radius: 12px; font-size: 12px; }
.main { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 220px; background: #1a1a2e; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.sidebar button { background: #252540; border: 1px solid #333; color: #ccc; padding: 12px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 13px; transition: all 0.2s; }
.sidebar button:hover { background: #0078d4; color: #fff; border-color: #0078d4; }
.sidebar button.active { background: #0078d4; color: #fff; border-color: #0078d4; }
.sidebar button .icon { font-size: 18px; margin-right: 8px; }
.chat-area { flex: 1; display: flex; flex-direction: column; }
.messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: #0078d4; color: #fff; border-bottom-right-radius: 4px; }
.msg.agent { align-self: flex-start; background: #252540; color: #e0e0e0; border-bottom-left-radius: 4px; }
.msg.system { align-self: center; background: transparent; color: #888; font-size: 12px; font-style: italic; }
.msg img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
.msg .tool-tag { display: inline-block; background: #00b04f22; color: #00b04f; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-right: 6px; margin-bottom: 4px; }
.msg .call-chain { background: #1a1a3e; border: 1px solid #333; border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; font-size: 11px; color: #888; font-family: monospace; }
.msg .call-chain .arrow { color: #0078d4; }
.msg .call-chain .timing { color: #00b04f; float: right; }
.input-bar { display: flex; gap: 8px; padding: 16px 24px; background: #1a1a2e; border-top: 1px solid #333; }
.input-bar input { flex: 1; background: #252540; border: 1px solid #444; color: #e0e0e0; padding: 12px 16px; border-radius: 8px; font-size: 14px; outline: none; }
.input-bar input:focus { border-color: #0078d4; }
.input-bar button { background: #0078d4; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.2s; }
.input-bar button:hover { background: #106ebe; }
.input-bar button:disabled { background: #555; cursor: not-allowed; }
.input-bar .mic-btn { background: #e74c3c; width: 48px; font-size: 20px; padding: 0; }
.input-bar .mic-btn.recording { background: #ff6b6b; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
.loading { display: inline-block; width: 20px; height: 20px; border: 2px solid #555; border-top-color: #0078d4; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>🎮 Foundry Agent + Toolbox Demo</h1>
  <span class="badge">Running on Azure</span>
  <span id="agentInfo" style="color:#aaa;font-size:11px;margin-left:auto;">Loading agent info...</span>
</header>
<div class="main">
  <div class="sidebar">
    <button class="active" onclick="switchMode('chat')"><span class="icon">💬</span>Text Chat</button>
    <button onclick="switchMode('voice')"><span class="icon">🎤</span>Voice Input</button>
    <button onclick="switchMode('image')"><span class="icon">🎨</span>Image Gen</button>
    <button onclick="switchMode('code')"><span class="icon">📊</span>Code Analysis</button>
    <button onclick="switchMode('edge')"><span class="icon">🌡️</span>Edge-Cloud</button>
    <div style="flex:1"></div>
    <button onclick="clearChat()" style="color:#e74c3c;border-color:#e74c3c33"><span class="icon">🗑️</span>Clear</button>
    <div style="margin-top:12px;border-top:1px solid #333;padding-top:12px">
      <div style="font-size:11px;color:#888;margin-bottom:6px">📦 Toolbox tools:</div>
      <div id="toolboxTools" style="font-size:11px;color:#aaa">Loading...</div>
    </div>
  </div>
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="msg system">Welcome! Choose a mode on the left, or just type a message below.</div>
    </div>
    <div class="input-bar" id="inputBar">
      <input type="text" id="userInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()" id="sendBtn">Send</button>
      <button class="mic-btn" id="micBtn" onclick="toggleRecord()" style="display:none">🎤</button>
    </div>
  </div>
</div>
<script>
let currentMode = 'chat';
let isRecording = false;
let mediaRecorder = null;
let audioChunks = [];

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
  event.target.closest('button').classList.add('active');
  const input = document.getElementById('userInput');
  const micBtn = document.getElementById('micBtn');
  const sendBtn = document.getElementById('sendBtn');
  micBtn.style.display = 'none';
  sendBtn.style.display = '';
  input.style.display = '';
  if (mode === 'chat') { input.placeholder = 'Ask anything — the agent picks the right tools...'; }
  else if (mode === 'voice') { input.placeholder = 'Or click 🎤 to speak...'; micBtn.style.display = ''; }
  else if (mode === 'image') { input.placeholder = 'Describe the image you want (e.g., "dark fantasy dragon at sunset")...'; }
  else if (mode === 'code') { input.placeholder = 'Ask a data analysis question (e.g., "compute stats for this data...")...'; }
  else if (mode === 'edge') { input.placeholder = ''; input.style.display = 'none'; sendBtn.textContent = '🌡️ Run Edge-Cloud Demo'; }
  if (mode !== 'edge') sendBtn.textContent = 'Send';
  addSystemMsg(`Switched to ${mode} mode`);
}

function addMsg(text, cls, extras) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  let html = '';
  // Call chain (only for agent messages)
  if (extras?.call_chain && extras.call_chain.length > 0) {
    const chainStr = extras.call_chain.map(c => `<span>${escapeHtml(c)}</span>`).join(' <span class="arrow">→</span> ');
    const timing = extras.elapsed_ms ? `<span class="timing">${extras.elapsed_ms}ms</span>` : '';
    html += `<div class="call-chain">${chainStr}${timing}</div>`;
  }
  // Tool tags
  if (extras?.tools && extras.tools.length > 0) {
    html += extras.tools.map(t => `<span class="tool-tag">🔧 ${escapeHtml(t.name || 'tool')}</span>`).join('');
    html += '<br>';
  }
  html += escapeHtml(text);
  div.innerHTML = html;
  if (extras?.image_b64) {
    const img = document.createElement('img');
    img.src = 'data:image/png;base64,' + extras.image_b64;
    div.appendChild(img);
  }
  document.getElementById('messages').appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
}
function addSystemMsg(text) { addMsg(text, 'system'); }
function escapeHtml(t) { const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

// Fetch Toolbox info on startup
async function loadToolboxInfo() {
  try {
    const resp = await fetch('/api/toolbox-info');
    const data = await resp.json();
    document.getElementById('agentInfo').textContent = `Agent: ${data.agent_endpoint} | Toolbox: ${data.toolbox_name} (${data.tools.length} tools)`;
    document.getElementById('toolboxTools').innerHTML = data.tools.map(t =>
      `<div style="margin-bottom:4px">🔧 <b>${t.name}</b><br/><span style="color:#666">${t.description}</span></div>`
    ).join('');
  } catch(e) {
    document.getElementById('agentInfo').textContent = 'Agent info unavailable';
    document.getElementById('toolboxTools').textContent = 'Could not load tools';
  }
}
loadToolboxInfo();

function showLoading() {
  const div = document.createElement('div');
  div.className = 'msg agent';
  div.id = 'loadingMsg';
  div.innerHTML = '<div class="loading"></div> Agent is thinking...';
  document.getElementById('messages').appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
}
function hideLoading() { const el = document.getElementById('loadingMsg'); if(el) el.remove(); }

async function sendChat() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();

  if (currentMode === 'edge') {
    addSystemMsg('Running edge-cloud sensor demo...');
    showLoading();
    try {
      const resp = await fetch('/api/edge-cloud', { method: 'POST' });
      const data = await resp.json();
      hideLoading();
      addMsg(data.text, 'agent', { tools: data.tool_calls, call_chain: data.call_chain, elapsed_ms: data.elapsed_ms });
    } catch(e) { hideLoading(); addMsg('Error: ' + e.message, 'system'); }
    return;
  }

  if (!text) return;
  input.value = '';
  addMsg(text, 'user');
  showLoading();

  try {
    let endpoint = '/api/chat';
    if (currentMode === 'image') endpoint = '/api/image';

    const form = new FormData();
    if (currentMode === 'image') {
      form.append('prompt', text);
    } else {
      form.append('message', text);
    }
    const resp = await fetch(endpoint, { method: 'POST', body: form });
    const data = await resp.json();
    hideLoading();
    addMsg(data.text, 'agent', { tools: data.tool_calls, image_b64: data.image_b64, call_chain: data.call_chain, elapsed_ms: data.elapsed_ms });
  } catch(e) { hideLoading(); addMsg('Error: ' + e.message, 'system'); }
}

async function toggleRecord() {
  const btn = document.getElementById('micBtn');
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
      audioChunks = [];
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        addSystemMsg(`Recorded ${(blob.size/1024).toFixed(1)} KB audio. Sending to Whisper...`);
        showLoading();
        const form = new FormData();
        form.append('audio', blob, 'recording.webm');
        try {
          const resp = await fetch('/api/voice', { method: 'POST', body: form });
          const data = await resp.json();
          hideLoading();
          if (data.transcript) addMsg(`🎤 "${data.transcript}"`, 'user');
          addMsg(data.text, 'agent', { tools: data.tool_calls, call_chain: data.call_chain, elapsed_ms: data.elapsed_ms });
        } catch(e) { hideLoading(); addMsg('Error: ' + e.message, 'system'); }
      };
      mediaRecorder.start();
      isRecording = true;
      btn.classList.add('recording');
      btn.textContent = '⏹';
    } catch(e) { addMsg('Microphone error: ' + e.message, 'system'); }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    btn.classList.remove('recording');
    btn.textContent = '🎤';
  }
}

function clearChat() {
  document.getElementById('messages').innerHTML = '<div class="msg system">Chat cleared.</div>';
}
</script>
</body>
</html>
