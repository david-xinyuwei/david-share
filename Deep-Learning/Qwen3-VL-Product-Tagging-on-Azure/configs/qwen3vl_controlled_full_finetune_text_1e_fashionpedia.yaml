# LLaMA-Factory full fine-tuning for Qwen3-VL-8B on Fashionpedia
# Controlled run: full text/decoder update, frozen vision tower/projector, 200 T1-style training images, 1 epoch.
# Data must be generated by scripts/prepare_fashionpedia_v2_dataset.py or an equivalent
# largest-area garment + category IDs 27-45 detail_tags path.

### model
model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full

### freeze
freeze_vision_tower: true
freeze_multi_modal_projector: true

### dataset
dataset_dir: ./configs
dataset: fashionpedia_controlled_train
template: qwen2_vl
cutoff_len: 4096
max_samples: 200
overwrite_cache: true
preprocessing_num_workers: 4

### output
output_dir: ./output/controlled_full_finetune_text_1e
logging_steps: 5
save_strategy: "no"
save_only_model: true
save_safetensors: true
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
optim: paged_adamw_8bit
report_to: none